apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: core-network
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/scale-down-delay: "30s"
    spec:
      containers:
        - image: 192.168.137.179:5000/core-network:latest
          ports:
            - containerPort: 8080

