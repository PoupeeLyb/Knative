apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: helloworld
  namespace: default
  annotations:
    serving.knative.dev/creator: kubernetes-admin
    serving.knative.dev/lastModifier: kubernetes-admin
spec:
  template:
    metadata:
      name: helloworld-template
    spec:
      containerConcurrency: 0
      containers:
        - name: user-container
          image: dev.local/helloworld:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: TARGET
              value: "Knative on Raspberry Pi"
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            successThreshold: 1
          resources: {}
      enableServiceLinks: false
      timeoutSeconds: 300
  traffic:
    - latestRevision: true
      percent: 100
